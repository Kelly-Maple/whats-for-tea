<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>What's for Tea</title>
<meta name="description" content="Easy dinner ideas, a weekly meal plan and a shopping list for our group.">
<meta name="theme-color" content="#1E5A42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="What's for Tea">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, one scrolling view, fixed bottom tab bar; recipe detail slides up as a sheet. */
:root{
  --bg:#F3F6F0; --surface:#FFFFFF; --sunk:#E8EEE5; --ink:#17251D; --muted:#56675D; --line:#D6DFD2;
  --brand:#1E5A42; --brand-ink:#FFFFFF; --brand-soft:#DAEAE0;
  --accent:#E0962A; --accent-ink:#2A1A02; --accent-soft:#FBE9C8;
  --danger:#B23B2A; --scrim:rgba(14,24,18,.45);
  --t-Mexican:#F3D2BC; --t-Italian:#F1D4D0; --t-Asian:#D5E6CC; --t-Indian:#F4DEAA; --t-Aussie:#CBDFEA; --t-Greek:#D8DCF0; --t-Other:#E2E6DE;
  --t-ink:#2A2A22;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#19221D; --sunk:#202A24; --ink:#E6EEE8; --muted:#9AACA1; --line:#2C3832;
  --brand:#6CC59B; --brand-ink:#0C1A13; --brand-soft:#21382C;
  --accent:#F0B457; --accent-ink:#2A1A02; --accent-soft:#3A2D16;
  --danger:#F08A75; --scrim:rgba(0,0,0,.6);
  --t-Mexican:#4A3225; --t-Italian:#4A2E2B; --t-Asian:#2C412E; --t-Indian:#493B1C; --t-Aussie:#233B48; --t-Greek:#2E3250; --t-Other:#2C322E;
  --t-ink:#F1EEE5; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#19221D; --sunk:#202A24; --ink:#E6EEE8; --muted:#9AACA1; --line:#2C3832;
  --brand:#6CC59B; --brand-ink:#0C1A13; --brand-soft:#21382C;
  --accent:#F0B457; --accent-ink:#2A1A02; --accent-soft:#3A2D16;
  --danger:#F08A75; --scrim:rgba(0,0,0,.6);
  --t-Mexican:#4A3225; --t-Italian:#4A2E2B; --t-Asian:#2C412E; --t-Indian:#493B1C; --t-Aussie:#233B48; --t-Greek:#2E3250; --t-Other:#2C322E;
  --t-ink:#F1EEE5; color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.1}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand h1 span{color:var(--accent)}
.household{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.household b{color:var(--ink);font-variant-numeric:tabular-nums;min-width:1.2em;text-align:center;font-size:15px}
.step{width:30px;height:30px;border-radius:50%;border:0;background:var(--sunk);font-size:18px;line-height:1;display:grid;place-items:center}
.step:active{background:var(--brand-soft)}

main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
.view{display:flex;flex-direction:column;gap:18px;padding-block:18px}
.lede{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);margin:4px 0 0}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip.flag[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.filters{display:flex;flex-direction:column;gap:10px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--sunk);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--danger);background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}

/* ideas panel */
.ideas{background:var(--brand-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.ideas h2{font-size:18px}
.ideas p{margin:0;color:var(--muted);font-size:14px}
.ideas .row input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.status{font-size:14px;color:var(--muted)}
.status.err{color:var(--danger)}

.picking{background:var(--accent-soft);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}

/* cards */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-head h2{font-size:19px}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{border:0;padding:0;text-align:left;background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 var(--line);min-width:0}
.card:active{transform:scale(.985)}
.tile{position:relative;aspect-ratio:4/3;max-width:100%;color:var(--t-ink);padding:10px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .cz{font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:-.03em;opacity:.28;line-height:.9;position:absolute;right:-4px;bottom:-4px;text-align:right}
.badges{position:relative;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 8px;letter-spacing:.02em}
.badge.ai{background:var(--brand);color:var(--brand-ink)}
.badge.ours{background:var(--accent);color:var(--accent-ink)}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.meta{font-size:12.5px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* plan */
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:start}
.day.today{box-shadow:inset 3px 0 0 var(--accent)}
.dname{font-family:var(--font-display);font-weight:800;font-size:18px;line-height:1}
.ddate{font-size:12px;color:var(--muted);margin-top:4px}
.meals{display:flex;flex-direction:column;gap:8px;min-width:0}
.meal{display:flex;align-items:center;gap:8px;min-width:0}
.meal .mt{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:15px}
.meal .mt small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.mini{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--muted);white-space:nowrap}
.mini button{width:26px;height:26px;border-radius:50%;border:0;background:var(--sunk);line-height:1}
.mini b{min-width:1.4em;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.x{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;flex:none}
.note{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:4px 4px 4px 12px;font-weight:600;font-size:14px;align-self:flex-start}
.dayacts{display:flex;gap:6px;flex-wrap:wrap}

/* shop */
.aisle{display:flex;flex-direction:column;gap:2px}
.aisle h3{font-size:13px;font-family:var(--font-body);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 2px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);padding:11px 14px;border-radius:12px;cursor:pointer}
.item input{width:22px;height:22px;margin:0;accent-color:var(--brand);flex:none}
.item .it{flex:1;min-width:0}
.item .q{font-weight:700;font-variant-numeric:tabular-nums}
.item small{display:block;color:var(--muted);font-size:12.5px}
.item.done .it{text-decoration:line-through;opacity:.5}
.addline{display:flex;gap:8px}
.addline input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}

/* add form */
form.add{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;width:100%}
.field textarea{min-height:140px;resize:vertical;line-height:1.5}
.field .hint{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.photo{border:2px dashed var(--line);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.photo img{max-height:240px;border-radius:12px;object-fit:cover}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.saveinfo{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 12px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--brand)}
.nav .pip{position:absolute;top:8px;left:calc(50% + 8px);background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:800;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet{left:50%;right:auto;width:640px;transform:translateX(-50%);bottom:auto;top:5%;max-height:90%;border-radius:22px;animation:none}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 0}
.sheet .hero{aspect-ratio:16/9;max-width:100%;position:relative;color:var(--t-ink);overflow:hidden;margin-top:10px}
.sheet .hero img{width:100%;height:100%;object-fit:cover}
.sheet .hero .cz{position:absolute;right:12px;bottom:4px;font-family:var(--font-display);font-weight:800;font-size:64px;letter-spacing:-.04em;opacity:.25}
.sheet .content{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.sheet h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.close{position:absolute;top:calc(14px);right:max(14px,env(safe-area-inset-right,0px));width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);font-size:22px;line-height:1;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.fact{background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.scale{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.ing li{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ing li:last-child{border-bottom:0}
.ing .qq{min-width:76px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brand)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;max-width:62ch}
.steps li::marker{font-family:var(--font-display);font-weight:800;color:var(--accent)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.daypick button small{font-weight:500;color:var(--muted);font-size:11px}
.daypick button.has{border-color:var(--brand)}
.daypick button.has small{color:var(--brand)}
.copybox{width:100%;min-height:200px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.card:active{transform:none}}
.cloud{font-size:13px;border-radius:12px;padding:10px 12px;background:var(--sunk);color:var(--muted)}
.cloud.err{background:var(--accent-soft);color:var(--ink)}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><h1>What's for <span>Tea</span></h1></div>
  <div class="household" aria-label="Household size">
    Cooking for
    <button class="step" id="hhMinus" aria-label="Fewer people">−</button>
    <b id="hhCount">4</b>
    <button class="step" id="hhPlus" aria-label="More people">+</button>
  </div>
</div></header>

<main class="wrap">
  <section class="view" id="v-discover"></section>
  <section class="view" id="v-plan" hidden></section>
  <section class="view" id="v-shop" hidden></section>
  <section class="view" id="v-add" hidden></section>
</main>

<nav class="nav" aria-label="Sections"><div class="in">
  <button data-view="discover" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M12 3v4M8.5 4.5 9.5 7M15.5 4.5 14.5 7"/></svg>Ideas</button>
  <button data-view="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week<span class="pip" id="pipPlan" hidden></span></button>
  <button data-view="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.5 12.5a2 2 0 0 1-2 1.5h-7a2 2 0 0 1-2-1.5Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Shopping<span class="pip" id="pipShop" hidden></span></button>
  <button data-view="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Add recipe</button>
</div></nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="firebase-config.js"></script>
<script type="module">
{
// ---------- reference data ----------
const DAYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_NAMES = {mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};
const PROTEINS = ['Chicken','Beef','Pork','Lamb','Seafood','Vegetarian'];
const CUISINES = ['Mexican','Italian','Asian','Indian','Aussie','Greek','Other'];
const TAGS = ['kids','onepan','slow'];
const TAG_LABELS = {kids:'Kid-friendly',onepan:'One pan',slow:'Slow cooker'};
const AISLES = ['Produce','Meat & seafood','Dairy & eggs','Bakery','Pantry','Freezer','Other'];
const AC = {P:'Produce',M:'Meat & seafood',D:'Dairy & eggs',B:'Bakery',A:'Pantry',F:'Freezer'};

// t title, c cuisine, p protein, m minutes, s serves, g tags, i "qty|unit|name|aisle", st steps
const RAW = [
 {t:'Chicken Fajitas',c:'Mexican',p:'Chicken',m:25,s:4,g:['kids','onepan'],i:['600|g|chicken breast|M','2||capsicums|P','1||red onion|P','30|g|fajita seasoning|A','8||tortillas|B','200|g|sour cream|D','1|cup|grated cheese|D','1||avocado|P','1||lime|P'],st:['Slice the chicken, capsicums and onion into strips.','Toss the chicken in the seasoning with a splash of oil.','Fry the chicken in a hot pan for 5–6 minutes, then add the veg and cook until soft.','Warm the tortillas and serve with sour cream, cheese, avocado and a squeeze of lime.']},

function cleanRecipe(x, src, id){

    tags: (Array.isArray(x.tags) ? x.tags : []).filter(t => TAGS.includes(t)),

  const items = shopItems(); const lines = ['Shopping list – week of ' + fmtDate(weekDates()[0])];
  for (const a of AISLES){ const l = items.filter(i => i.a === a && !S.plan.checked[i.key]); if (!l.length) continue;
    lines.push('', a.toUpperCase(), ...l.map(i => '☐ ' + (i.hasQ ? fmtQty(i.q, i.u, true) + ' ' : '') + i.n)); }
  const ex = S.plan.extras.filter(x => !x.done); if (ex.length) lines.push('', 'EXTRAS', ...ex.map(x => '☐ ' + x.n));
  copyText(lines.join('\n'), 'List copied. Paste it into Notes or a message.');
}



// ---------- add recipe ----------
let draftPhoto = null;
function renderAdd(){
  const v = $('#v-add');
  const prev = v.querySelector('form') ? collectForm() : null;
  v.replaceChildren();
  const shared = cloud === 'on';
  v.append(h('div', null, h('div', {class:'lede'}, 'Add a recipe'),
    h('p', {class:'sub'}, 'Share a family favourite. Snap the dish or the recipe card so everyone knows what they’re making.')));
  const note = cloudNote(); if (note) v.append(note);
  const fileIn = h('input', {type:'file', accept:'image/*', id:'photoIn', hidden:true, onchange: onPhoto});
  const photoBox = h('div', {class:'photo'},
    draftPhoto ? h('img', {src: draftPhoto, alt:'Recipe photo'}) : h('div', {class:'meta'}, 'A photo of the dish or the recipe itself'),
    h('div', {class:'row', style:'justify-content:center'},
      h('button', {type:'button', class:'btn', onclick: () => fileIn.click()}, draftPhoto ? 'Change photo' : 'Take or choose a photo'),
      draftPhoto ? h('button', {type:'button', class:'btn ghost', onclick: () => { draftPhoto = null; renderAdd(); }}, 'Remove') : null),
    fileIn);
  const f = h('form', {class:'add', onsubmit: saveForm},
    photoBox,
    h('div', {class:'field'}, h('label', {for:'fTitle'}, 'Recipe name'), h('input', {id:'fTitle', required:true, maxlength:80, placeholder:'Nan’s chicken casserole'})),
    h('div', {class:'cols'},
      h('div', {class:'field'}, h('label', {for:'fProtein'}, 'Main'), h('select', {id:'fProtein'}, PROTEINS.map(p => h('option', null, p)))),
      h('div', {class:'field'}, h('label', {for:'fCuisine'}, 'Style'), h('select', {id:'fCuisine'}, CUISINES.map(c => h('option', {value:c}, c === 'Other' ? 'Other / family classic' : c)))),
      h('div', {class:'field'}, h('label', {for:'fServes'}, 'Serves'), h('input', {id:'fServes', type:'number', min:1, max:20, value:4, inputmode:'numeric'})),
      h('div', {class:'field'}, h('label', {for:'fTime'}, 'Minutes'), h('input', {id:'fTime', type:'number', min:1, max:720, value:30, inputmode:'numeric'}))),
    h('div', {class:'field'}, h('span', {class:'lab'}, 'Good for'), h('div', {class:'checks'}, TAGS.map(t => h('label', null, h('input', {type:'checkbox', id:'fTag-' + t}), TAG_LABELS[t])))),
    h('div', {class:'field'}, h('label', {for:'fIng'}, 'Ingredients'), h('textarea', {id:'fIng', placeholder:'500 g chicken thigh\n2 onions\n1 tin diced tomatoes\n1 cup rice'}),
      h('span', {class:'hint'}, 'One per line, amount first. These go straight onto the shopping list.')),
    h('div', {class:'field'}, h('label', {for:'fSteps'}, 'Method'), h('textarea', {id:'fSteps', placeholder:'Brown the chicken.\nAdd the onion and cook until soft.\n…'}),
      h('span', {class:'hint'}, 'One step per line.')),
    shared ? h('div', {class:'field'}, h('label', {for:'fName'}, 'Your name'), h('input', {id:'fName', maxlength:40, placeholder:'Shown as “Added by …”', value: lsGet(NAME_KEY) || ''})) : null,
    h('div', {class:'saveinfo'}, shared ? 'Saves to the shared recipe book, so everyone with the link can cook it.' : 'Saved on this phone until the shared book is connected.'),
    h('button', {class:'btn primary', type:'submit', id:'saveBtn'}, shared ? 'Save to our recipe book' : 'Save recipe'));
  v.append(f);
  if (prev) fillForm(prev);
}
function collectForm(){
  const val = id => document.getElementById(id)?.value ?? '';
  return {title: val('fTitle'), protein: val('fProtein'), cuisine: val('fCuisine'), serves: val('fServes'), time: val('fTime'),
    tags: TAGS.filter(t => document.getElementById('fTag-' + t)?.checked), ingText: val('fIng'), stepsText: val('fSteps')};
}
function fillForm(d){
  const set = (id,v) => { const el = document.getElementById(id); if (el && v != null && v !== '') el.value = v; };
  set('fTitle', d.title); set('fProtein', d.protein); set('fCuisine', d.cuisine); set('fServes', d.serves); set('fTime', d.time);
  set('fIng', d.ingText); set('fSteps', d.stepsText);
  for (const t of TAGS){ const el = document.getElementById('fTag-' + t); if (el) el.checked = (d.tags||[]).includes(t); }
}
async function compressImage(file, maxDim = 1000, maxChars = 250000){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight)), q = 0.78;
    for (let k = 0; k < 7; k++){
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth*scale)); c.height = Math.max(1, Math.round(img.naturalHeight*scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL('image/jpeg', q); if (d.length <= maxChars) return d;
      scale *= 0.8; q = Math.max(0.5, q - 0.06);
    }
  } catch {} finally { URL.revokeObjectURL(url); }
  return null;
}
async function onPhoto(e){
  const file = e.target.files?.[0]; if (!file) return;
  const d = await compressImage(file);
  if (!d){ toast('That photo couldn’t be opened. Try a JPEG or PNG.'); return; }
  draftPhoto = d; renderAdd();
}
async function saveForm(e){
  e.preventDefault();
  const d = collectForm();
  const name = (document.getElementById('fName')?.value || '').trim().slice(0,40);
  if (name) lsSet(NAME_KEY, name);
  const ing = d.ingText.split('\n').map(parseLine).filter(Boolean);
  const r = cleanRecipe({title: d.title, protein: d.protein, cuisine: d.cuisine, serves: +d.serves, time: +d.time, tags: d.tags, ing,
    steps: d.stepsText.split('\n'), photo: draftPhoto}, 'mine', 'm-' + uidGen());
  if (!r){ toast('Give the recipe a name first'); return; }
  if (!r.ing.length){ toast('Add at least one ingredient'); return; }
  const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  const where = await storeRecipe(r, name || lsGet(NAME_KEY) || '');
  draftPhoto = null; $('#v-add').querySelector('form').reset();
  renderAdd();
  toast(where === 'shared' ? r.title + ' is in the recipe book' : r.title + ' saved on this phone');
}
async function storeRecipe(r, byName){
  if (cloud === 'on' && F){
    const body = {title: r.title, cuisine: r.cuisine, protein: r.protein, tags: r.tags, time: r.time, serves: r.serves, blurb: r.blurb, steps: r.steps, ing: r.ing,
      photo: r.photo, by: uid, byName: String(byName || '').slice(0,40), createdAt: Date.now()};
    try { await F.setDoc(F.doc(fsdb, 'recipes', 'r-' + uidGen()), body); return 'shared'; }
    catch (err) { toast('Couldn’t reach the shared book, so this one is saved on this phone.'); }
  }
  const mine = {...r, src: 'mine', id: 'm-' + uidGen()};
  S.mine.unshift(mine);
  if (!lsSet(MINE_KEY, S.mine)){ mine.photo = null; lsSet(MINE_KEY, S.mine); }
  return 'local';
}

// ---------- recipe sheet ----------
let lastFocus = null;
function openSheet(children){
  lastFocus = document.activeElement;
  const sh = $('#sheet');
  sh.replaceChildren(h('div', {class:'grab'}), h('button', {class:'close', 'aria-label':'Close', onclick: closeSheet}, '×'),
    ...(Array.isArray(children) && children[0]?.classList?.contains('hero') ? [children.shift()] : []),
    h('div', {class:'content wrap'}, children));
  sh.hidden = false; $('#scrim').hidden = false; sh.scrollTop = 0; document.body.style.overflow = 'hidden';
  sh.querySelector('.close').focus();
}
function closeSheet(){ $('#sheet').hidden = true; $('#scrim').hidden = true; document.body.style.overflow = ''; lastFocus?.focus?.(); }
let delArmed = false;
function openRecipe(r, entry){
  const serves = entry ? servingsFor(entry) : S.plan.servings; const f = serves / (r.serves || 4);
  const hero = tile(r, 'hero');
  const dates = weekDates();
  const kids = [hero,
    h('div', null, h('h2', null, r.title), r.blurb ? h('p', {class:'sub'}, r.blurb) : null, byLine(r) ? h('p', {class:'sub'}, byLine(r)) : null),
    h('div', {class:'facts'}, h('span', {class:'fact'}, minutes(r.time)), h('span', {class:'fact'}, r.protein), r.cuisine !== 'Other' ? h('span', {class:'fact'}, r.cuisine) : null,
      r.tags.map(t => h('span', {class:'fact'}, TAG_LABELS[t])))];
  if (!entry){
    kids.push(h('div', {class:'label'}, S.picking ? 'Add to your week' : 'Add to a night this week'));
    if (S.picking) kids.push(h('button', {class:'btn primary', onclick: () => { addToDay(S.picking, r); S.picking = null; closeSheet(); go('plan'); }}, 'Add to ' + DAY_NAMES[S.picking]));
    kids.push(h('div', {class:'daypick'}, DAYS.map((d,i) => { const c = (S.plan.days[d]||[]).filter(e => e.type === 'meal').length;
      return h('button', {class: c ? 'has' : '', 'aria-label':'Add to ' + DAY_NAMES[d], onclick: () => { addToDay(d, r); if (S.picking){ S.picking = null; closeSheet(); go('plan'); } else openRecipe(r); }},
        DAY_NAMES[d].slice(0,3), h('small', null, c ? c + ' planned' : dates[i].getDate())); })));
  }
  kids.push(h('div', {class:'scale'}, serves === r.serves ? 'Amounts for ' + serves + ' people.' : 'Amounts scaled for ' + serves + ' people (the original serves ' + r.serves + ').'));
  kids.push(h('div', {class:'label'}, 'Ingredients'),
    h('ul', {class:'ing'}, r.ing.map(i => h('li', null, h('span', {class:'qq'}, fmtQty(i.q != null ? i.q*f : null, i.u) || '–'), h('span', null, i.n)))));
  if (r.steps.length) kids.push(h('div', {class:'label'}, 'Method'), h('ol', {class:'steps'}, r.steps.map(s => h('li', null, s))));
  const acts = h('div', {class:'row'});
  const canDelete = r.src === 'mine' || (r.src === 'shared' && F && uid && r.by === uid);
  if (canDelete) acts.append(h('button', {class:'btn danger', onclick: async ev => {
    if (!delArmed){ delArmed = true; ev.target.textContent = 'Tap again to delete'; setTimeout(() => delArmed = false, 3000); return; }
    delArmed = false;
    if (r.src === 'mine'){ S.mine = S.mine.filter(x => x.id !== r.id); lsSet(MINE_KEY, S.mine); }
    else { try { await F.deleteDoc(F.doc(fsdb, 'recipes', r.id)); } catch { toast('Couldn’t delete that one'); return; } }
    toast('Recipe deleted'); closeSheet(); render(); }}, 'Delete recipe'));
  if (acts.childNodes.length) kids.push(acts);
  openSheet(kids);
}

// ---------- shell ----------
function renderPips(){
  const n = mealsCount(); const pp = $('#pipPlan'); pp.hidden = !n; pp.textContent = n;
  const left = n ? shopItems().filter(i => !S.plan.checked[i.key]).length + S.plan.extras.filter(x => !x.done).length : S.plan.extras.filter(x => !x.done).length;
  const ps = $('#pipShop'); ps.hidden = !left; ps.textContent = left;
  $('#hhCount').textContent = S.plan.servings;
}
function render(){
  renderPips();
  if (S.view === 'discover') renderDiscover();
  else if (S.view === 'plan') renderPlan();
  else if (S.view === 'shop') renderShop();
}
function go(view){
  S.view = view;
  for (const b of document.querySelectorAll('.nav button')){ if (b.dataset.view === view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }
  for (const k of ['discover','plan','shop','add']) $('#v-' + k).hidden = k !== view;
  if (view !== 'discover' && view !== 'plan') S.picking = null;
  render(); window.scrollTo(0,0);
}
document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => { if (b.dataset.view !== 'discover') S.picking = null; go(b.dataset.view); }));
$('#hhMinus').addEventListener('click', () => { S.plan.servings = Math.max(1, S.plan.servings - 1); savePlan(); render(); });
$('#hhPlus').addEventListener('click', () => { S.plan.servings = Math.min(20, S.plan.servings + 1); savePlan(); render(); });
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

const start = (location.hash || '').slice(1);
renderAdd();
go(['discover','plan','shop','add'].includes(start) ? start : 'discover');
initCloud();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
